# XcodeGen spec. On a Mac:
#   brew install xcodegen
#   cd ios && xcodegen generate
#   open FF7Recomp.xcodeproj
name: FF7Recomp
options:
  bundleIdPrefix: com.ff7recomp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
targets:
  FF7Recomp:
    type: application
    platform: iOS
    sources:
      - path: FF7Recomp
      - path: ../src/platform
        createIntermediateGroups: true
      - path: ../src/ios
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ff7recomp.ios
        PRODUCT_NAME: FF7Recomp
        INFOPLIST_FILE: FF7Recomp/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: FF7Recomp/Bridge/FF7Recomp-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../src/platform"
          - "$(SRCROOT)/../src/ios"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: FF7Recomp/Resources/Info.plist
      properties:
        CFBundleDisplayName: FF7Recomp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ff7recomp.gamepackage
            UTTypeDescription: FF7Recomp Game Package
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - ff7pkg
