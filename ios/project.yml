# XcodeGen spec. On a Mac:
#   brew install xcodegen
#   cd ios && xcodegen generate
#   open FF7Recomp.xcodeproj
name: FF7Recomp
options:
  bundleIdPrefix: com.ff7recomp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
targets:
  FF7Recomp:
    type: application
    platform: iOS
    sources:
      - path: FF7Recomp
      - path: ../src/platform
        createIntermediateGroups: true
      - path: ../src/ios
        createIntermediateGroups: true
      - path: ../src/ios_mods          # unpacking mod downloads (zip; 7z below)
        createIntermediateGroups: true
        excludes: ["ff7_ios_modinfo.cpp"]   # needs the core's mod layer (full app only)
      # .7z mod downloads: the Android port's un7z.c and the LZMA SDK's 7z reader (external/,
      # tools/fetch_android_core.sh)
      - path: ../external/ff7-recomp-android/src/android/un7z.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zArcIn.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zBuf.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zCrc.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zCrcOpt.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zDec.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zStream.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zAlloc.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zFile.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Bcj2.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Bra.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Bra86.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/BraIA64.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/CpuArch.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Delta.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Lzma2Dec.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/LzmaDec.c
        group: ModUnpack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ff7recomp.ios
        PRODUCT_NAME: FF7Recomp
        OTHER_LDFLAGS: ["$(inherited)", "-lz"]
        INFOPLIST_FILE: FF7Recomp/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: FF7Recomp/Bridge/FF7Recomp-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../src/platform"
          - "$(SRCROOT)/../src/ios"
          - "$(SRCROOT)/../src/ios_mods"
          - "$(SRCROOT)/../external/ff7-recomp-android/external/deps/lzma"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: FF7Recomp/Resources/Info.plist
      properties:
        CFBundleDisplayName: FF7Recomp
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "0.2.3"
        CFBundleVersion: "3"        # 0.2.3b
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIFileSharingEnabled: true
        CADisableMinimumFrameDurationOnPhone: true   # 120 Hz screens may run above 60 (Frame rate: 120 FPS)
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ff7recomp.iro
            UTTypeDescription: 7th Heaven IRO Mod
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - iro

  # The app with the lifted game linked in (your own ff7_en.exe, for your own devices only,
  # never distributed). Same bundle ID as the launcher, so installing it keeps the game files.
  # FF7Recomp Builder (mac/builder) makes the IPA for an iPhone; for the simulator:
  #   bash tools/build_ios_core.sh simulator     # builds ../build-ios-sim/libff7_bundle.a
  #   bash tools/stage_ffnx_runtime.sh           # FFNx's shaders and settings -> ../build-ios-ffnx
  #   xcodegen generate && xcodebuild -scheme FF7RecompBundled -sdk iphonesimulator ...
  #   bash tools/ios_sim_link_game.sh            # the app's game folder -> ../game (simulator only)
  FF7RecompBundled:
    type: application
    platform: iOS
    sources:
      - path: FF7Recomp
      - path: ../src/platform
        createIntermediateGroups: true
      - path: ../src/ios
        createIntermediateGroups: true
      - path: ../src/ios_mods          # unpacking mod downloads (zip; 7z below)
        createIntermediateGroups: true
      # .7z mod downloads: the Android port's un7z.c and the LZMA SDK's 7z reader (external/,
      # tools/fetch_android_core.sh); LzmaDec.c is in the core already
      - path: ../external/ff7-recomp-android/src/android/un7z.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zArcIn.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zBuf.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zCrc.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zCrcOpt.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zDec.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zStream.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zAlloc.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/7zFile.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Bcj2.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Bra.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Bra86.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/BraIA64.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/CpuArch.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Delta.c
        group: ModUnpack
      - path: ../external/ff7-recomp-android/external/deps/lzma/Lzma2Dec.c
        group: ModUnpack
      - path: ../build-ios-ffnx/ffnx      # FFNx's run-time files (stage_ffnx_runtime.sh)
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ff7recomp.ios   # the same app: a Mac build installs over the launcher and keeps the game files
        PRODUCT_NAME: FF7RecompBundled
        INFOPLIST_FILE: FF7Recomp/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: FF7Recomp/Bridge/FF7Recomp-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../src/platform"
          - "$(SRCROOT)/../src/ios"
          - "$(SRCROOT)/../src/ios_mods"
          - "$(SRCROOT)/../external/ff7-recomp-android/external/deps/lzma"
          - "$(SRCROOT)/../external/ff7-recomp-android/src/mods"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) FF7_BUNDLE_GAME=1 FF7_PLATFORM_ios=1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FF7_BUNDLE_GAME"
        "FF7_CORE_DIR[sdk=iphonesimulator*]": "$(SRCROOT)/../build-ios-sim"
        "FF7_CORE_DIR[sdk=iphoneos*]": "$(SRCROOT)/../build-ios-device"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(FF7_CORE_DIR)/libff7_bundle.a"
          - "-lc++"
          - "-lz"
          - "-framework Metal"
          - "-framework QuartzCore"
          - "-framework CoreVideo"
          - "-framework CoreMedia"
          - "-framework VideoToolbox"
          - "-framework AudioToolbox"
          - "-framework AVFoundation"
          - "-framework CoreAudio"
        DEAD_CODE_STRIPPING: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64   # the core is built arm64 only

  FF7RecompTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FF7RecompTests
    dependencies:
      - target: FF7Recomp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ff7recomp.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FF7Recomp:
    build:
      targets:
        FF7Recomp: all
        FF7RecompTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FF7RecompTests
  FF7RecompBundled:
    build:
      targets:
        FF7RecompBundled: all
    run:
      config: Debug
